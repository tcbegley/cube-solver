[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project]
name = "twophase"
version = "0.2.0"
description = "An educational implementation of Kociemba's two-phase cube-solving algorithm."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["tqdm>=4.66.5"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.11.13",
    "ty>=0.0.21",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.format]
skip-magic-trailing-comma = true

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
